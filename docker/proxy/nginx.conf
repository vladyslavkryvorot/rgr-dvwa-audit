# Зворотний проксі — єдина служба з портом на хості (127.0.0.1:8080).
# DVWA та БД перебувають лише у внутрішній мережі backend.
server {
    listen 80;
    server_name _;
    client_max_body_size 4m;

    location / {
        proxy_pass http://dvwa:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
