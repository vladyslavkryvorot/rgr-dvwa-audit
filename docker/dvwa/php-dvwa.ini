; Конфігурація PHP стенда — стан «після» (глибокий захист для профілю варіанта 8).
display_errors = Off          ; T9: без шляхів і стеків у відповідях
log_errors = On
error_log = /dev/stderr       ; журнал подій [rgr-security] потрапляє в журнал контейнера (T13)
expose_php = Off
allow_url_include = Off       ; T6: включення за URL заборонено
allow_url_fopen = On          ; потрібне окремим модулям DVWA; для профілю не використовується
open_basedir = /var/www/html:/tmp   ; T4/T6: навіть за помилки в коді /etc, /proc недоступні
file_uploads = On
upload_max_filesize = 2M
upload_tmp_dir = /tmp
