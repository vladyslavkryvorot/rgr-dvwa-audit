# Конфігурація Apache стенда — стан «після».
ServerName dvwa.local
ServerTokens Prod
ServerSignature Off

# Каталог завантажень: лише статичні файли (глибокий захист для V1, V2, V7).
<Directory /var/www/html/hackable/uploads>
    # V7: файли .htaccess у каталозі ігноруються
    AllowOverride None
    Options -Indexes -ExecCGI -Includes
    # V1/V2: PHP-код у каталозі не виконується, а PHP-подібні й службові файли не віддаються
    php_admin_flag engine off
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|pht|phps|htaccess|htpasswd)$">
        Require all denied
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox"
</Directory>
